<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>貸卓予約</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --green: #2FA361; --green-dark: #1E7A47; --green-pale: #E3F5E9;
    --bg-top: #EAF9EF; --bg-bottom: #C9EAD3;
    --pink: #E4127E; --pink-deep: #B80E63; --pink-soft: #FCE0EE;
    --ink: #3F3F3F; --ink-soft: #1E1E1E;
    --white: #FFFFFF;
    --radius: 20px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,0.5) 0, transparent 35%),
      radial-gradient(circle at 85% 30%, rgba(255,255,255,0.35) 0, transparent 30%),
      linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    min-height:100vh; font-family:'Zen Kaku Gothic New', sans-serif; color:var(--ink);
    display:flex; justify-content:center; padding:0 0 60px;
  }
  #app{width:100%; max-width:480px; min-height:100vh;}
  .header{padding:28px 20px 6px; text-align:center; color:var(--ink);}
  .header .mark{
    width:64px;height:64px; margin:0 auto 8px;
    display:flex;align-items:center;justify-content:center;
  }
  .header .mark img{width:100%;height:100%;object-fit:contain;}
  .header h1{font-family:'Zen Maru Gothic', sans-serif; font-weight:900; font-size:30px; letter-spacing:.02em; margin:0 0 2px; color:var(--pink);}
  .header p{margin:0; font-size:11.5px; letter-spacing:.1em; color:var(--green-dark); font-weight:700;}

  .notice{
    margin:14px 16px 0; padding:9px 12px; border-radius:12px;
    background:var(--pink-soft); border:1.5px solid var(--pink);
    color:var(--pink-deep); font-size:11.5px; line-height:1.6; text-align:center; font-weight:700;
  }

  .steps{display:flex; justify-content:center; gap:8px; padding:14px 20px 16px;}
  .step-dot{
    width:26px;height:26px;border-radius:50%;background:var(--white);color:var(--ink-soft);
    border:2px solid var(--green-pale);
    font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all .25s ease;
  }
  .step-dot.active{background:var(--pink);border-color:var(--pink);color:var(--white);box-shadow:0 2px 0 var(--pink-deep);}
  .step-dot.done{background:var(--green);border-color:var(--green);color:var(--white);}

  .card{background:var(--white); margin:0 16px 16px; border-radius:var(--radius); padding:22px 18px 24px;
    border:3px solid var(--ink);
    box-shadow: 5px 5px 0 var(--ink);}
  .card h2{font-family:'Zen Maru Gothic', sans-serif; font-weight:900; font-size:18px; margin:0 0 4px; color:var(--green-dark);}
  .card .sub{font-size:12px; color:var(--ink-soft); margin:0 0 18px; line-height:1.6;}

  label.field{display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin:0 0 6px; letter-spacing:.03em;}
  input[type="date"], input[type="text"], input[type="tel"], input[type="number"], input[type="password"], textarea{
    width:100%; padding:12px 12px; border-radius:12px; border:2px solid var(--green-pale);
    background:#fff; font-family:inherit; font-size:15px; color:var(--ink); margin-bottom:18px;
  }
  textarea{resize:vertical; min-height:70px;}
  input:focus-visible, button:focus-visible, .tile:focus-visible, .chip:focus-visible{outline:3px solid var(--pink); outline-offset:2px;}

  .chip-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:18px;}
  .chip-grid.two{grid-template-columns:repeat(2,1fr);}
  .chip-grid.four{grid-template-columns:repeat(4,1fr);}
  .chip{
    padding:10px 6px; border-radius:12px; border:2px solid var(--green-pale); background:#fff;
    font-size:13px; font-weight:700; color:var(--ink); cursor:pointer; text-align:center; transition:all .15s ease;
  }
  .chip.selected{background:var(--pink); border-color:var(--pink); color:var(--white); box-shadow:0 2px 0 var(--pink-deep); transform:translateY(1px);}
  .chip:disabled, .chip.disabled{opacity:.4; cursor:not-allowed;}

  .capacity-note{font-size:12px; color:var(--green-dark); font-weight:700; margin:-8px 0 16px;}
  .capacity-note.full{color:var(--pink-deep);}

  .toggle-row{display:flex; align-items:center; justify-content:space-between; padding:12px 4px; border-bottom:1px solid var(--green-pale);}
  .toggle-row:last-of-type{border-bottom:none; margin-bottom:6px;}
  .toggle-row .name{font-size:14px;font-weight:700;}
  .toggle-row .desc{font-size:11px;color:var(--ink-soft);}
  .switch{width:46px;height:26px;border-radius:13px;background:#E1E1E1;position:relative;cursor:pointer;flex-shrink:0;margin-left:12px;transition:background .2s ease;}
  .switch.on{background:var(--pink);}
  .switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s ease;box-shadow:0 1px 2px rgba(0,0,0,0.3);}
  .switch.on::after{transform:translateX(20px);}

  .section-label{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--green-dark);margin:0 0 8px;text-transform:uppercase;}

  .btn-row{display:flex; gap:10px; padding:0 16px;}
  .btn{flex:1; padding:15px 10px; border-radius:14px; border:3px solid var(--ink); font-family:'Zen Maru Gothic',sans-serif; font-size:15px; font-weight:900; cursor:pointer; text-align:center;}
  .btn-primary{background:var(--pink); color:var(--white); box-shadow:4px 4px 0 var(--ink);}
  .btn-primary:disabled{background:#D8D8D8; border-color:#B9B9B9; box-shadow:4px 4px 0 #B9B9B9; color:var(--ink-soft); cursor:not-allowed;}
  .btn-secondary{background:var(--white); color:var(--ink); box-shadow:4px 4px 0 var(--ink);}

  .summary-row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px dashed var(--green-pale); font-size:13px;}
  .summary-row:last-child{border-bottom:none;}
  .summary-row .k{color:var(--ink-soft);}
  .summary-row .v{font-weight:700;text-align:right;max-width:60%;}

  .done-screen{text-align:center; color:var(--ink); padding:60px 24px;}
  .done-screen .mark{width:68px;height:68px;margin:0 auto 16px;background:var(--white);border:3px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Zen Maru Gothic',sans-serif;font-size:30px;font-weight:900;color:var(--pink);box-shadow:4px 4px 0 var(--ink);}
  .done-screen h2{font-family:'Zen Maru Gothic',sans-serif;font-weight:900;font-size:20px;margin:0 0 8px;color:var(--green-dark);}
  .done-screen p{font-size:13px;color:var(--ink-soft);margin:0 0 28px;line-height:1.7;}

  .staff-toggle{text-align:center; padding:6px 0 20px;}
  .staff-toggle button{background:none;border:none;color:var(--green-dark);font-size:11px;text-decoration:underline;cursor:pointer;font-family:inherit;font-weight:700;}
  .staff-panel{margin:0 16px 20px; background:var(--white); border:2px solid var(--green-pale); border-radius:14px; padding:14px 16px; color:var(--ink); font-size:12px;}
  .staff-panel h3{margin:0 0 10px;font-size:12px;letter-spacing:.05em;color:var(--green-dark);}
  .staff-panel .res-item{padding:8px 0;border-bottom:1px solid var(--green-pale); line-height:1.6;}
  .staff-panel .res-item:last-child{border-bottom:none;}
  .staff-panel .empty{color:var(--ink-soft);}
  .staff-panel .login-row{display:flex; gap:8px;}
  .staff-panel input[type="password"], .staff-panel input[type="date"]{margin-bottom:0; flex:1; padding:9px 10px; font-size:13px;}
  .staff-panel .login-row button{padding:9px 14px; border-radius:10px; border:2px solid var(--ink); background:var(--pink); color:var(--white); font-weight:700; font-size:13px; cursor:pointer;}
  .staff-panel .error{color:var(--pink-deep); font-size:11px; margin-top:6px;}

  .error-msg{background:var(--pink-soft); color:var(--pink-deep); font-size:12px; font-weight:700; padding:10px 12px; border-radius:10px; margin-bottom:14px;}

  @keyframes bounce-squash{
    0%,100%{transform:translateY(0) scaleX(1.12) scaleY(0.88);}
    30%{transform:translateY(-14px) scaleX(0.94) scaleY(1.08);}
    50%{transform:translateY(-18px) scaleX(0.97) scaleY(1.05);}
    70%{transform:translateY(-14px) scaleX(0.94) scaleY(1.08);}
  }
  .loading-bounce{animation:bounce-squash 0.9s ease-in-out infinite; transform-origin:bottom center; display:block;}
  @keyframes shadow-squash{
    0%,100%{transform:scaleX(1); opacity:0.28;}
    50%{transform:scaleX(0.55); opacity:0.12;}
  }
  .loading-shadow{width:40px;height:10px;border-radius:50%;background:#000;margin:2px auto 0;animation:shadow-squash 0.9s ease-in-out infinite;}
  @keyframes pulse-dot{
    0%,20%{opacity:0.2;}
    50%{opacity:1;}
    100%{opacity:0.2;}
  }
  .loading-dot{display:inline-block;animation:pulse-dot 1.2s infinite;}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;} .loading-bounce{animation:none;} .loading-shadow{animation:none;} .loading-dot{animation:none;}}
</style>

const usingRealBackend = () => !!CONFIG.APPS_SCRIPT_URL;

/* ---------- データ層：本番(Apps Script) / テスト(window.storage) 切り替え ---------- */
async function apiGetCapacity(date){
  if(usingRealBackend()){
    const url = `${CONFIG.APPS_SCRIPT_URL}?action=capacity&date=${encodeURIComponent(date)}`;
    const res = await fetch(url);
    return await res.json();
  }
  // テストモード：window.storageの共有データから集計
  try{
    const stored = await window.storage.get(`reservations:${date}`, true);
    const list = stored && stored.value ? JSON.parse(stored.value) : [];
    let reserved = list.reduce((sum,r)=>sum+Number(r.tableCount||0),0);
    const hasCharter = list.some(r=>r.roomType==='貸切希望');
    if(hasCharter) reserved = CONFIG.TOTAL_TABLES;
    return {totalTables:CONFIG.TOTAL_TABLES, reserved, remaining:Math.max(0,CONFIG.TOTAL_TABLES-reserved), hasExistingReservation: reserved>0};
  }catch(e){
    return {totalTables:CONFIG.TOTAL_TABLES, reserved:0, remaining:CONFIG.TOTAL_TABLES, hasExistingReservation:false};
  }
}

async function apiSubmit(record){
  if(usingRealBackend()){
    const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"}, // Apps Scriptのpreflight回避のためtext/plainを使用
      body:JSON.stringify(record),
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    return data;
  }
  try{
    const stored = await window.storage.get(`reservations:${record.date}`, true);
    const list = stored && stored.value ? JSON.parse(stored.value) : [];
    list.push(record);
    await window.storage.set(`reservations:${record.date}`, JSON.stringify(list), true);
    return {result:"ok"};
  }catch(e){
    throw new Error("保存に失敗しました");
  }
}

async function apiGetMonthOverview(password){
  if(usingRealBackend()){
    const url = `${CONFIG.APPS_SCRIPT_URL}?action=monthOverview&password=${encodeURIComponent(password)}`;
    const res = await fetch(url);
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    return data.months; // [{sheetName, reservations:[...]}, {sheetName, reservations:[...]}]
  }
  if(password !== CONFIG.DEMO_STAFF_PASSWORD) throw new Error("unauthorized");
  try{
    const listResult = await window.storage.list('reservations:', true);
    const keys = listResult && listResult.keys ? listResult.keys : [];
    const now = new Date();
    const months = [];
    for(let offset=0; offset<2; offset++){
      const d = new Date(now.getFullYear(), now.getMonth()+offset, 1);
      const mk = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      const matchingKeys = keys.filter(k => k.startsWith(`reservations:${mk}`));
      let reservations = [];
      for(const k of matchingKeys){
        try{
          const r = await window.storage.get(k, true);
          if(r && r.value) reservations = reservations.concat(JSON.parse(r.value));
        }catch(e){}
      }
      reservations.sort((a,b)=>(a.date+a.startTime).localeCompare(b.date+b.startTime));
      months.push({sheetName:mk, reservations});
    }
    return months;
  }catch(e){
    return [{sheetName:'', reservations:[]},{sheetName:'', reservations:[]}];
  }
}
async function apiGetClosedDates(){
  if(usingRealBackend()){
    try{
      const res = await fetch(`${CONFIG.APPS_SCRIPT_URL}?action=closedDates`);
      const data = await res.json();
      if(Array.isArray(data.closedWeekdays)) closedWeekdays = data.closedWeekdays;
      return data.closedDates || [];
    }catch(e){ return []; }
  }
  try{
    const storedWeekdays = await window.storage.get('closedWeekdays', true);
    if(storedWeekdays && storedWeekdays.value) closedWeekdays = JSON.parse(storedWeekdays.value);
    const stored = await window.storage.get('closedDates', true);
    return stored && stored.value ? JSON.parse(stored.value) : [];
  }catch(e){ return []; }
}

async function apiUpdateClosedWeekdays(weekdays, password){
  if(usingRealBackend()){
    const res = await fetch(`${CONFIG.APPS_SCRIPT_URL}?action=updateClosedWeekdays&password=${encodeURIComponent(password)}`, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({weekdays}),
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    return data;
  }
  await window.storage.set('closedWeekdays', JSON.stringify(weekdays), true);
  return {result:'ok'};
}

async function apiAddClosedDate(date, reason, password){
  if(usingRealBackend()){
    const res = await fetch(`${CONFIG.APPS_SCRIPT_URL}?action=addClosedDate&password=${encodeURIComponent(password)}`, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({date, reason}),
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    return data;
  }
  const list = await apiGetClosedDates();
  list.push({date, reason});
  await window.storage.set('closedDates', JSON.stringify(list), true);
  return {result:'ok'};
}

async function apiRemoveClosedDate(date, password){
  if(usingRealBackend()){
    const res = await fetch(`${CONFIG.APPS_SCRIPT_URL}?action=removeClosedDate&password=${encodeURIComponent(password)}`, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({date}),
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    return data;
  }
  let list = await apiGetClosedDates();
  list = list.filter(c=>c.date!==date);
  await window.storage.set('closedDates', JSON.stringify(list), true);
  return {result:'ok'};
}

function captureFocus(){
  const el = document.activeElement;
  if(!el || !el.id || !(el.tagName==='INPUT'||el.tagName==='TEXTAREA')) return null;
  return { id: el.id, selStart: el.selectionStart, selEnd: el.selectionEnd };
}
function restoreFocus(info){
  if(!info) return;
  const el = document.getElementById(info.id);
  if(!el) return;
  el.focus();
  if(typeof info.selStart === 'number' && el.setSelectionRange){
    try{ el.setSelectionRange(info.selStart, info.selEnd); }catch(e){}
  }
}

function stepValid(){
  if(step===1) return !!(state.date && state.startTime);
  if(step===2) return !!(state.tableCount && state.roomType && state.format && state.points);
  if(step===3) return true;
  if(step===4) return !!(state.name.trim() && state.phone.trim());
  return true;
}

// 入力中に画面全体を作り直すとカーソル位置やIME変換が壊れるため、
// 連続入力するフィールド（日付・時間・数字・お名前・電話番号・ご要望）は
// 画面を作り直さずに状態だけ更新し、ボタンの有効/無効だけを軽く同期する。
function setFieldSilent(name, value){ state[name] = value; syncButtonState(); }

function setDateSilent(value){
  const msgEl = document.getElementById('date-error-msg');
  if(value){
    const d = new Date(value + 'T00:00:00');
    if(closedWeekdays.includes(d.getDay())){
      dateBlocked = '定休日（日曜・月曜）のため、この日はご予約いただけません。<br>別の日をお選びください。';
      state.date = ""; capacityInfo = null;
      if(msgEl){ msgEl.innerHTML = dateBlocked; msgEl.style.display = 'block'; }
      syncButtonState();
      return;
    }
    const closedMatch = closedDatesList.find(c => c.date === value);
    if(closedMatch){
      dateBlocked = `臨時休業のため、この日はご予約いただけません。${closedMatch.reason ? '（'+closedMatch.reason+'）' : ''}<br>別の日をお選びください。`;
      state.date = ""; capacityInfo = null;
      if(msgEl){ msgEl.innerHTML = dateBlocked; msgEl.style.display = 'block'; }
      syncButtonState();
      return;
    }
  }
  dateBlocked = false;
  if(msgEl) msgEl.style.display = 'none';
  state.date = value; capacityInfo = null; syncButtonState();
}

  } else {
    const [h,m] = value.split(':').map(Number);
    const mins = h*60+m;
    if(mins < 12*60){
      startTimeBlocked = 'early';
      state.startTime = "";
    } else if(mins > 21*60+30){
      startTimeBlocked = 'late';
      state.startTime = "";
    } else {
      startTimeBlocked = false;
      state.startTime = value;
    }
  }
  // 入力欄の値自体は書き換えない（スクロール操作中に書き換えるとピッカーが壊れるため）
  if(msgEl){
    msgEl.innerHTML = timeErrorMessageHtml();
    msgEl.style.display = startTimeBlocked ? 'block' : 'none';
  }
  syncButtonState();
}

function syncButtonState(){
  const btn = document.querySelector('.btn-primary');
  if(btn) btn.disabled = !stepValid();
}
function setTableCount(n){ state.tableCount = n; render(); }
function toggleSwitch(name){ state[name] = !state[name]; render(); }
function goStep(n){ step = n; render(); }

async function submitReservation(){
  submitting = true; submitError = ""; render();
  const record = {
    name: state.name, phone: state.phone, date: state.date, startTime: state.startTime,
    tableCount: state.tableCount, roomType: state.roomType, format: state.format, points: state.points,
    akadora: state.akadora, hanahai: state.hanahai, chip: state.chip, yakitori: state.yakitori,
    request: state.request,
    lineUserId: liffUserId,
    lineDisplayName: liffDisplayName,
  };
  try{
    await apiSubmit(record);
    step = 6;
  }catch(e){
    submitError = "予約の送信に失敗しました。通信環境をご確認のうえ、もう一度お試しください。";
  }
  submitting = false;
  render();
}

function toggleStaffPanel(){ staffOpen = !staffOpen; render(); }

function monthLabelFromSheetName(sheetName){
  const m = (sheetName||'').match(/^(\d{2})(\d{2})/);
  if(!m) return sheetName || '(不明な月)';
  return `${2000+Number(m[1])}年${Number(m[2])}月`;
}
function formatDateShort(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d)) return dateStr;
  const w = ['日','月','火','水','木','金','土'][d.getDay()];
  return `${d.getMonth()+1}/${d.getDate()}（${w}）`;
}
function groupByDate(reservations){
  const map = {};
  (reservations||[]).forEach(r=>{
    if(!map[r.date]) map[r.date] = [];
    map[r.date].push(r);
  });
  return Object.keys(map).sort().map(date=>({date, items:map[date]}));
}

function renderStaffPanel(){
  if(!staffOpen) return '';
  if(!staffAuthed){
    return `
      <div class="staff-panel">
        <h3>スタッフ確認用ログイン</h3>
        <div class="login-row">
          <input type="password" id="staffPw" placeholder="パスワード" value="${staffPasswordInput}"
            oninput="staffPasswordInput=this.value">
          <button onclick="staffLogin()">確認</button>
        </div>
        ${staffError ? `<div class="error">${staffError}</div>` : ''}
      </div>
    `;
  }
  if(!monthOverviewData){
    return `<div class="staff-panel"><div class="empty">読み込み中…</div></div>`;
  }
  const monthsHtml = monthOverviewData.map(month=>{
    const groups = groupByDate(month.reservations);
    return `
      <div style="margin-bottom:14px;">
        <div style="font-weight:900;color:var(--green-dark);margin-bottom:8px;">${monthLabelFromSheetName(month.sheetName)}</div>
        ${groups.length===0 ? `<div class="empty">この月の予約はまだありません</div>` :
          groups.map(g=>{
            const expanded = expandedDates.has(g.date);
            const compactLines = g.items.map(r=>
              `${r.startTime}〜　${r.name}様　${r.tableCount}卓${r.roomType==='貸切希望' ? '　<span style="color:var(--pink-deep);font-weight:900;">（貸切）</span>' : ''}${r.confirmStatus!=='確認済み' ? '　<span style="color:var(--pink-deep);font-weight:900;">未確認</span>' : ''}`
            ).join('<br>');
            const detailHtml = g.items.map(r=>`
              <div class="res-item">
                ${r.startTime}〜／${r.tableCount}卓／${r.roomType==='貸切希望'?'<strong style="color:var(--pink-deep);">貸切希望</strong>':'ルームシェアOK'}／${r.format}／${r.points}点<br>
                ${r.name}様・${r.phone}<br>
                確認ステータス：${r.confirmStatus==='確認済み'?'確認済み':'<strong style="color:var(--pink-deep);">未確認</strong>'}<br>
                赤牌:${r.akadora===true||r.akadora==='あり'?'あり':'なし'}　花牌:${r.hanahai===true||r.hanahai==='あり'?'あり':'なし'}　チップ:${r.chip===true||r.chip==='あり'?'あり':'なし'}　ヤキトリ:${r.yakitori===true||r.yakitori==='あり'?'あり':'なし'}
                ${r.request ? `<br>ご要望：${r.request}` : ''}
              </div>`).join('');
            return `
              <div style="border-bottom:1px solid var(--green-pale); padding:8px 0; cursor:pointer;" onclick="toggleDateExpand('${g.date}')">
                <div style="font-weight:700;">${expanded?'▼':'▶'} ${formatDateShort(g.date)}</div>
                <div style="font-size:12px; color:var(--ink-soft); margin-top:2px;">${compactLines}</div>
              </div>
              ${expanded ? detailHtml : ''}
            `;
          }).join('')
        }
      </div>
    `;
  }).join('');
  const weekdayLabels = ['日','月','火','水','木','金','土'];
  const weekdaysHtml = `
    <div style="margin-bottom:16px; padding-bottom:14px; border-bottom:2px solid var(--green-pale);">
      <div style="font-weight:900;color:var(--green-dark);margin-bottom:8px;">定休日の設定</div>
      <div style="display:flex; gap:6px; margin-bottom:10px;">
        ${weekdayLabels.map((label,i)=>`
          <div class="chip" style="flex:1; padding:8px 4px; ${closedWeekdays.includes(i)?'background:var(--pink);border-color:var(--pink);color:var(--white);':''}"
            onclick="toggleClosedWeekday(${i})">${label}</div>
        `).join('')}
      </div>
      <button class="btn btn-primary" style="width:100%; padding:10px;" onclick="staffSaveClosedWeekdays()">この内容で保存</button>
    </div>
  `;
  const closedDatesHtml = `
    <div style="margin-bottom:16px; padding-bottom:14px; border-bottom:2px solid var(--green-pale);">
      <div style="font-weight:900;color:var(--green-dark);margin-bottom:8px;">臨時休業日の管理</div>
      <div class="login-row" style="margin-bottom:8px;">
        <input type="date" id="closedDateInput">
        <button onclick="staffAddClosedDate()">追加</button>
      </div>
      <input type="text" id="closedReasonInput" placeholder="理由（任意）"
        style="width:100%;margin-bottom:12px;padding:9px 10px;border-radius:10px;border:2px solid var(--green-pale);font-size:13px;box-sizing:border-box;">
      ${closedDatesList.length===0 ? `<div class="empty" style="padding:14px;">登録されている休業日はありません</div>` :
        closedDatesList.map(c=>`
          <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--green-pale);font-size:13px;">
            <span>${c.date}${c.reason?'　'+c.reason:''}</span>
            <span style="cursor:pointer;color:var(--pink-deep);font-weight:700;text-decoration:underline;" onclick="staffRemoveClosedDate('${c.date}')">削除</span>
          </div>
        `).join('')
      }
    </div>
  `;
  return `
    <div class="staff-panel">
      <h3>予約状況を確認　<span style="cursor:pointer;text-decoration:underline;" onclick="staffRefresh()">更新</span>　<span style="cursor:pointer;text-decoration:underline;" onclick="staffLogout()">ログアウト</span></h3>
      ${weekdaysHtml}
      ${closedDatesHtml}
      ${monthsHtml}
    </div>
  `;
}

async function staffLogin(){
  try{
    monthOverviewData = await apiGetMonthOverview(staffPasswordInput);
    staffAuthed = true; staffError = "";
  }catch(e){
    staffError = "パスワードが違います";
  }
  render();
}
async function staffRefresh(){
  try{
    monthOverviewData = await apiGetMonthOverview(staffPasswordInput);
  }catch(e){}
  render();
}
function staffLogout(){ staffAuthed = false; staffPasswordInput = ""; monthOverviewData = null; expandedDates = new Set(); render(); }
function toggleDateExpand(date){
  if(expandedDates.has(date)) expandedDates.delete(date); else expandedDates.add(date);
  render();
}

function toggleClosedWeekday(dayIndex){
  const i = closedWeekdays.indexOf(dayIndex);
  if(i>-1) closedWeekdays.splice(i,1); else closedWeekdays.push(dayIndex);
  render();
}
async function staffSaveClosedWeekdays(){
  try{
    await apiUpdateClosedWeekdays(closedWeekdays, staffPasswordInput);
    alert('定休日の設定を保存しました');
  }catch(e){
    alert('保存に失敗しました。もう一度お試しください。');
  }
}
async function staffAddClosedDate(){
  const dateEl = document.getElementById('closedDateInput');
  const reasonEl = document.getElementById('closedReasonInput');
  if(!dateEl || !dateEl.value) return;
  try{
    await apiAddClosedDate(dateEl.value, reasonEl ? reasonEl.value : '', staffPasswordInput);
    closedDatesList = await apiGetClosedDates();
    render();
  }catch(e){
    alert('休業日の追加に失敗しました。もう一度お試しください。');
  }
}
async function staffRemoveClosedDate(date){
  try{
    await apiRemoveClosedDate(date, staffPasswordInput);
    closedDatesList = await apiGetClosedDates();
    render();
  }catch(e){
    alert('削除に失敗しました。もう一度お試しください。');
  }
}

// グローバル公開
window.setField=setField; window.setFieldSilent=setFieldSilent; window.setDateSilent=setDateSilent;
window.setStartTimeSilent=setStartTimeSilent; window.setTableCount=setTableCount;
window.toggleDateExpand=toggleDateExpand; window.staffRefresh=staffRefresh;
window.staffAddClosedDate=staffAddClosedDate; window.staffRemoveClosedDate=staffRemoveClosedDate;
window.toggleClosedWeekday=toggleClosedWeekday; window.staffSaveClosedWeekdays=staffSaveClosedWeekdays;
window.toggleSwitch=toggleSwitch; window.goStep=goStep; window.submitReservation=submitReservation;
window.toggleStaffPanel=toggleStaffPanel; window.staffLogin=staffLogin; window.staffLogout=staffLogout;

(async () => {
  app.innerHTML = loadingScreenHtml("読み込んでいます");
  await initLiff();
  closedDatesList = await apiGetClosedDates();
  render();
})();
</script>
